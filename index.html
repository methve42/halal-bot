<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalalInvest AI • Automated Sharia Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.6rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-badge {
            display: inline-block;
            background-color: #1e293b;
            color: #38bdf8;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 10px;
            border: 1px solid #334155;
        }
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            background: #1e293b;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #334155;
        }
        .filter-bar input, .filter-bar select {
            background: #0f172a;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            flex: 1;
            min-width: 140px;
        }
        .filter-bar input:focus, .filter-bar select:focus {
            border-color: #38bdf8;
        }
        .stock-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 16px;
            border-radius: 10px;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        .card:hover {
            border-color: #38bdf8;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .stock-title {
            font-size: 1.15rem;
            font-weight: bold;
            color: #ffffff;
        }
        .stock-ticker {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-left: 4px;
        }
        .badge-growth {
            background: #064e3b;
            color: #34d399;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .card-details {
            font-size: 0.92rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 14px;
        }
        .btn-tr {
            display: inline-block;
            background: #2563eb;
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-tr:hover {
            background: #1d4ed8;
        }
        .no-results {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
            background: #1e293b;
            border-radius: 10px;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <header>
        <h1>🕌 HalalInvest Live AI</h1>
        <div id="status-text" class="status-badge">Daten werden geladen...</div>
    </header>

    <div class="filter-bar">
        <input type="text" id="search-input" placeholder="Aktie oder Ticker suchen..." oninput="applyFilters()">
        <select id="sector-filter" onchange="applyFilters()">
            <option value="ALL">Alle Sektoren</option>
        </select>
        <select id="sort-select" onchange="applyFilters()">
            <option value="growth-desc">Höchstes Wachstum zuerst</option>
            <option value="price-asc">Günstigster Preis zuerst</option>
            <option value="debt-asc">Niedrigste Schulden zuerst</option>
        </select>
    </div>

    <div id="stock-list" class="stock-grid"></div>

    <script>
        let LIVE_STOCKS = [];

        async function loadDailyData() {
            const statusEl = document.getElementById('status-text');
            try {
                const res = await fetch('data.json?t=' + new Date().getTime());
                LIVE_STOCKS = await res.json();
                
                statusEl.innerText = `Aktiv • ${LIVE_STOCKS.length} Halal-Aktien geladen`;
                statusEl.style.color = '#34d399';
                
                populateSectors();
                applyFilters();
            } catch (err) {
                statusEl.innerText = "Stand: Daten werden von GitHub Actions aufgebaut...";
                statusEl.style.color = '#fbbf24';
                document.getElementById('stock-list').innerHTML = `
                    <div class="no-results">
                        ⚠️ Die Live-Datenbank wird gerade aktualisiert oder ist noch nicht erreichbar.<br>
                        Bitte überprüfe, ob der Scan auf GitHub erfolgreich durchgelaufen ist.
                    </div>`;
            }
        }

        function populateSectors() {
            const sectorSelect = document.getElementById('sector-filter');
            const sectors = new Set();
            
            LIVE_STOCKS.forEach(s => {
                if (s.sector) sectors.add(s.sector);
            });

            sectors.forEach(sec => {
                const option = document.createElement('option');
                option.value = sec;
                option.textContent = sec;
                sectorSelect.appendChild(option);
            });
        }

        function applyFilters() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const selectedSector = document.getElementById('sector-filter').value;
            const sortBy = document.getElementById('sort-select').value;

            let filtered = LIVE_STOCKS.filter(s => {
                const matchesSearch = s.name.toLowerCase().includes(query) || s.ticker.toLowerCase().includes(query);
                const matchesSector = selectedSector === 'ALL' || s.sector === selectedSector;
                return matchesSearch && matchesSector;
            });

            // Sortierung anwenden
            if (sortBy === 'growth-desc') {
                filtered.sort((a, b) => (b.growth || 0) - (a.growth || 0));
            } else if (sortBy === 'price-asc') {
                filtered.sort((a, b) => (a.price || 0) - (b.price || 0));
            } else if (sortBy === 'debt-asc') {
                filtered.sort((a, b) => (a.debt_ratio || 0) - (b.debt_ratio || 0));
            }

            renderCards(filtered);
        }

        function renderCards(stocks) {
            const container = document.getElementById('stock-list');
            if (!stocks || stocks.length === 0) {
                container.innerHTML = `<div class="no-results">Keine passenden Halal-Aktien gefunden.</div>`;
                return;
            }

            container.innerHTML = stocks.map(s => renderCard(s)).join('');
        }

        function renderCard(s) {
            const price = s.price !== undefined ? s.price : 'k. A.';
            const target = s.target && s.target > 0 ? s.target + ' €' : 'k. A.';
            const growth = s.growth !== undefined ? s.growth : 0;
            const debt = s.debt_ratio !== undefined ? s.debt_ratio : (s.debtRatio || 'k. A.');
            const sector = s.sector || 'Technologie / Sonstige';
            
            const trSearchUrl = `https://www.google.com/search?q=Trade+Republic+${encodeURIComponent(s.ticker)}+${encodeURIComponent(s.name)}`;

            return `
                <div class="card">
                    <div class="card-header">
                        <span class="stock-title">${s.name} <span class="stock-ticker">(${s.ticker})</span></span>
                        <span class="badge-growth">+${growth}% Wachstum</span>
                    </div>
                    
                    <div class="card-details">
                        💰 Preis: <b>${price} €</b> | 🎯 Zielpreis: <b>${target}</b><br>
                        📊 Schuldenquote: <b>${debt}%</b> (Sharia-Konform ✅)<br>
                        🏢 Sektor: <i>${sector}</i>
                    </div>

                    <a href="${trSearchUrl}" target="_blank" class="btn-tr">
                        📈 Bei Trade Republic suchen ↗
                    </a>
                </div>
            `;
        }

        window.onload = loadDailyData;
    </script>
</body>
</html>
