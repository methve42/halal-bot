<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalalInvest AI - Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col items-center p-4">

    <header class="w-full max-w-3xl flex justify-between items-center py-4 border-b border-slate-800 mb-4">
        <div class="flex items-center gap-3">
            <div class="bg-emerald-500/20 text-emerald-400 p-2.5 rounded-xl border border-emerald-500/30">
                <i class="fa-solid fa-chart-line text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold">HalalInvest <span class="text-emerald-400">Live AI</span></h1>
                <p class="text-xs text-slate-400" id="status-text">Lade tagesaktuelle Marktdaten...</p>
            </div>
        </div>
        <span class="bg-emerald-500/10 text-emerald-400 text-xs px-3 py-1 rounded-full border border-emerald-500/20">
            ● Cloud Auto-Sync
        </span>
    </header>

    <main class="w-full max-w-3xl bg-slate-800/50 border border-slate-700/50 rounded-2xl h-[70vh] flex flex-col overflow-hidden shadow-xl">
        <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-3"></div>

        <div class="p-3 border-t border-slate-700/50 bg-slate-900/80 flex gap-2">
            <input type="text" id="user-input" placeholder="Frage eingeben (z.B. 'Kioxia', 'Alle Aktien')..." 
                   class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-emerald-500"
                   onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-sm transition">
                Senden
            </button>
        </div>
    </main>

    <script>
        let LIVE_STOCKS = [];

        async function loadDailyData() {
            try {
                const res = await fetch('data.json?t=' + new Date().getTime());
                LIVE_STOCKS = await res.json();
                document.getElementById('status-text').innerText = `Aktiv • ${LIVE_STOCKS.length} High-Potential Aktien geladen`;
                
                // AUTOMATISCHE ANZEIGE ALLER AKTIEN BEIM LADEN
                let html = `<b>Assalamu Alaikum!</b><br>Der Scanner hat heute automatisch <b>${LIVE_STOCKS.length} Halal-Aktien</b> mit hohem Potenzial identifiziert:<br><br>`;
                
                if (LIVE_STOCKS.length === 0) {
                    html += "Aktuell entsprechen keine Aktien allen strikten Filtern.";
                } else {
                    LIVE_STOCKS.forEach(s => html += renderCard(s));
                }
                
                appendBotMsg(html);
            } catch (err) {
                document.getElementById('status-text').innerText = "Stand: Erstes Cloud-Update ausstehend";
                appendBotMsg("⚠️ Die Live-Datenbank wird gerade von GitHub Actions aufgebaut.");
            }
        }


        function appendUserMsg(text) {
            const box = document.getElementById("chat-box");
            box.innerHTML += `<div class="flex justify-end"><div class="bg-emerald-500 text-slate-950 font-medium px-4 py-2.5 rounded-2xl rounded-tr-none text-sm max-w-[80%]">${text}</div></div>`;
            box.scrollTop = box.scrollHeight;
        }

        function appendBotMsg(html) {
            const box = document.getElementById("chat-box");
            box.innerHTML += `<div class="flex items-start gap-2.5">
                <div class="w-7 h-7 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs flex-shrink-0">🤖</div>
                <div class="bg-slate-800 border border-slate-700 p-3.5 rounded-2xl rounded-tl-none text-sm text-slate-200 max-w-[85%]">${html}</div>
            </div>`;
            box.scrollTop = box.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById("user-input");
            const q = input.value.trim();
            if (!q) return;

            appendUserMsg(q);
            input.value = "";

            setTimeout(() => {
                const text = q.toLowerCase();
                if (text.includes("kioxia")) {
                    const match = LIVE_STOCKS.find(s => s.name.toLowerCase().includes("kioxia") || s.ticker.includes("285A"));
                    if (match) {
                        appendBotMsg(`<b>💾 Kioxia Analyse (Live-Daten):</b><br>${match.desc}${renderCard(match)}`);
                    } else {
                        appendBotMsg("Kioxia ist aktuell in den heutigen Top-Filtern nicht enthalten oder wird gerade analysiert.");
                    }
                } else if (text.includes("alle") || text.includes("liste")) {
                    let html = "<b>Tagesaktuelle Halal KI-Topempfehlungen:</b>";
                    LIVE_STOCKS.forEach(s => html += renderCard(s));
                    appendBotMsg(html);
                } else {
                    let html = "Hier sind die aktuellen Top-Ergebnisse des heutigen Scans:";
                    LIVE_STOCKS.slice(0, 2).forEach(s => html += renderCard(s));
                    appendBotMsg(html);
                }
            }, 300);
        }

        function renderCard(s) {
            return `
                <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl text-xs space-y-2 my-2">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-1.5">
                        <span class="font-bold text-white">${s.name} <span class="text-slate-500 font-normal">(${s.ticker})</span></span>
                        <span class="bg-emerald-500/20 text-emerald-400 font-bold px-2 py-0.5 rounded">${s.growth1Y}</span>
                    </div>
                    <div class="grid grid-cols-3 gap-2 text-slate-400">
                        <div>Sektor: <b class="text-slate-200 block">${s.sector}</b></div>
                        <div>Kurs: <b class="text-slate-200 block">$${s.price}</b></div>
                        <div>Ziel (1J): <b class="text-emerald-400 block">$${s.target1Y}</b></div>
                    </div>
                    <div class="flex justify-between items-center border-t border-slate-800 pt-1.5">
                        <span class="text-slate-400">Schuldenquote: <b class="text-emerald-400">${s.debtRatio}</b></span>
                        <button onclick="document.getElementById('user-input').value='Kioxia'; sendMessage();" class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2.5 py-1 rounded font-bold hover:bg-emerald-500/30">
                            📂 Öffnen
                        </button>
                    </div>
                </div>
            `;
        }

        window.onload = loadDailyData;
    </script>
</body>
</html>
